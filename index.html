<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV PAZ ANGOLA - Ao Vivo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#281407">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,Arial;background:#281407;color:#fff;min-height:100vh}
  .header{text-align:center;padding:25px 15px 15px}
  .logo-box{width:115px;height:115px;background:#fff;border-radius:24px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#281407;font-weight:900;line-height:1;font-size:26px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
  .live-wrap{margin:15px;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .live-badge{background:#e63946;color:#fff;text-align:center;padding:8px;font-weight:800;font-size:13px;letter-spacing:1px}
  .live-wrap iframe{width:100%;height:215px;border:0;display:block}
  .content{padding:15px 15px 90px}
  .card{background:#fff;color:#281407;border-radius:16px;padding:16px;margin-bottom:12px}
  .card h3{margin-bottom:6px}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer}
  .btn-dark{background:#281407;color:#fff;margin-top:10px}
  .btn-whats{background:#25D366;color:#fff}
  #btn-instalar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:999;background:#fff;color:#281407;border:0;padding:15px 28px;border-radius:30px;font-weight:900;box-shadow:0 8px 25px rgba(0,0,0,.5);display:none}
</style>
</head>
<body>

<div class="header">
  <div class="logo-box">TV<br>PAZ</div>
  <h2>TV PAZ ANGOLA</h2>
  <p style="opacity:.75;font-size:13px;margin-top:4px">Levando a paz até você • Ao Vivo 24h</p>
</div>

<div class="live-wrap">
  <div class="live-badge">🔴 AO VIVO AGORA</div>
  <!-- TROCA o ID do video abaixo pelo ID do culto ao vivo da TV PAZ -->
  <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk" allowfullscreen allow="autoplay; encrypted-media"></iframe>
</div>

<div class="content">
  <div class="card">
    <h3>📺 Programação</h3>
    <p style="font-size:14px;line-height:1.4">Cultos, louvores, orações e mensagens de paz todos os dias. Fique ligado no ao vivo.</p>
    <button class="btn btn-dark" onclick="document.querySelector('.live-wrap').scrollIntoView({behavior:'smooth'})">ASSISTIR AGORA</button>
  </div>

  <div class="card">
    <h3>💬 Fale Conosco</h3>
    <p style="font-size:14px;margin-bottom:10px">Envie seu pedido de oração</p>
    <button class="btn btn-whats" onclick="window.open('https://wa.me/244900000000?text=Olá TV PAZ ANGOLA! Vim pelo APP','_blank')">FALAR NO WHATSAPP</button>
  </div>
</div>

<button id="btn-instalar">📲 Instalar APP</button>

<script>
// PWA
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
let deferredPrompt; const btnInst=document.getElementById('btn-instalar');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btnInst.style.display='block'});
btnInst.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const c=await deferredPrompt.userChoice;if(c.outcome==='accepted')btnInst.style.display='none';deferredPrompt=null});
</script>
</body>
</html>
