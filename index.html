<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV PAZ ANGOLA - Ao Vivo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#281407">
<link rel="apple-touch-icon" href="logo.png">
<style>
  body{margin:0;font-family:Arial;background:#281407;color:white}
  .top{text-align:center;padding:20px}
  .top img{width:110px;border-radius:15px}
  .live-box{background:black;padding:0;border-radius:14px;overflow:hidden;margin:15px}
  .live-box iframe{width:100%;height:220px;border:none}
  .live-info{background:#e63946;padding:8px;text-align:center;font-weight:bold;font-size:13px}
  .container{padding:0 15px 80px 15px}
  .card{background:white;color:#281407;padding:16px;border-radius:14px;margin-bottom:12px}
  .btn{background:#281407;color:white;padding:13px;border:none;width:100%;border-radius:10px;font-weight:bold}
  .btn-whats{background:#25D366}
  #btn-instalar{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:9999;padding:14px 28px;background:white;color:#281407;border-radius:30px;border:none;font-weight:bold;box-shadow:0 5px 25px rgba(0,0,0,0.6)}
</style>
</head>
<body>

<div class="top">
  <img src="logo.png">
  <h2 style="margin:10px 0 0 0">TV PAZ ANGOLA</h2>
  <p style="margin:5px 0;font-size:13px;opacity:0.8">Levando a paz até você</p>
</div>

<!-- PLAYER AO VIVO -->
<div class="live-box">
  <div class="live-info">🔴 AO VIVO AGORA</div>
  <!-- TROCA O SRC PELO TEU LINK -->
  <iframe src="https://www.youtube.com/embed/live_stream?channel=COLOCA_O_ID_DO_CANAL_AQUI" allowfullscreen></iframe>
</div>

<div class="container">
  <div class="card">
    <h3 style="margin:0 0 8px 0">📺 Programação</h3>
    <p style="margin:0;font-size:14px">Cultos, louvores e mensagens de paz 24h por dia</p>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px 0">Fale Conosco</h3>
    <button class="btn btn-whats" onclick="window.open('https://wa.me/244900000000?text=Paz! Vim pelo App da TV PAZ ANGOLA','_blank')">FALAR NO WHATSAPP</button>
  </div>

  <div class="card" style="text-align:center;font-size:12px;opacity:0.7">
    App Oficial TV PAZ ANGOLA © 2026
  </div>
</div>

<button id="btn-instalar">📲 Instalar App TV PAZ</button>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
let promptInstalacao=null;const btn=document.getElementById('btn-instalar');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstalacao=e;btn.style.display='block'});
btn.addEventListener('click',async()=>{if(!promptInstalacao)return;promptInstalacao.prompt();const r=await promptInstalacao.userChoice;if(r.outcome==='accepted')btn.style.display='none';promptInstalacao=null});
</script>

</body>
</html>
